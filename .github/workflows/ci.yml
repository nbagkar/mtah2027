name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: no match data or submissions in the repo
        run: bash scripts/check_no_data.sh all
      - run: python -W ignore -m pytest -q

  # One-off (branch ci/linux-determinism): does the pipeline give the same labels on other
  # platforms? Runs on the public dev set only -- no competition data ever reaches CI.
  fingerprint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python devset/build.py
      - run: python -W ignore scripts/dev_fingerprint.py
